<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Biot Games</title>
    <link rel="stylesheet" href="a2.css">
</head>
<body>

<nav class="pages">
    <div class="nav-left">
        <img src="biot-logo.png" width="100" height="50" alt="Biot Games Logo">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
    </div>

    <div class="nav-right">
        <a href="login.html" class="active">Log In</a>
        <a href="sign.html">Sign Up</a>
    </div>
</nav>

<main>

    <div class="sign-container">
        <h1>Log In</h1>
        <p>Welcome back to Biot Games!</p>

        <form>
            <label>Email</label>
            <input type="email" placeholder="Enter email" required>

            <label>Password</label>
            <input type="password" placeholder="Enter password" required>

            <button type="submit">Log In</button>
        </form>

        <p class="sign-up-link">
            Don't have an account? <a href="sign.html">Sign Up</a>
        </p>
    </div>

</main>

</body>
</html>
